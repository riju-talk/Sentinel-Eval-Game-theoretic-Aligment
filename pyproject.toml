[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-eval"
version = "0.1.0"
description = "Interpretability-first evaluation harness for agentic systems: jury judges, failure attribution with counterfactual replay, adversarial prompt-injection testing."
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "httpx>=0.27", "pandas>=2", "pyarrow>=15"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
train = ["torch", "transformers", "trl>=0.24", "peft", "bitsandbytes", "datasets"]
dev = ["pytest>=8"]

[project.scripts]
sentinel-eval = "sentinel_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
